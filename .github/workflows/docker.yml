name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create frontend placeholder
        run: |
          mkdir -p internal/dashboardui/dist
          echo '<!DOCTYPE html><html><body>MCPJungle</body></html>' > internal/dashboardui/dist/index.html

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -o mcpjungle ./cmd/mcpjungle

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mcpjungle:latest
